name: macOS regression

on:
  workflow_dispatch:
  push:
    branches: [main, windows-support]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare client environment
        run: cp apps/web/.env.example apps/web/.env

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test Unix-socket CLI handshake
        run: npm run test:cli-handshake

      - name: Test newline and legacy EOF framing
        run: npm run test:cli-framing

      - name: Test deep-link routing
        run: npm run test:deep-links

      - name: Build desktop and AppKit addon
        run: npm run build --workspace=@diffusionstudio/desktop

      - name: Package unsigned macOS application
        run: npm run package --workspace=@diffusionstudio/desktop
        env:
          SKIP_SIGN: "1"
